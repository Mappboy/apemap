name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - "issue-51-*"
  workflow_dispatch:

env:
  APEMAP_OFFLINE: "1"

jobs:
  quality:
    name: Code Quality & Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --extra review-ui --frozen

      - name: Check lockfile sync
        run: uv lock --check

      - name: Validate review ledger and immutable base events
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run apemap review check
          if [ -n "$REVIEW_BASE" ] && [ "$REVIEW_BASE" != "0000000000000000000000000000000000000000" ]; then
            uv run apemap review check --base "$REVIEW_BASE"
          fi

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Type Check (ty)
        run: uv run ty check apemap/

      - name: Check Dependencies (deptry)
        run: uv run deptry apemap

      - name: Run Pre-commit Hooks (prek)
        run: uv run prek run --all-files

  tests:
    name: Test Suite (Offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --extra review-ui --frozen

      - name: Restore pinned raw inputs
        env:
          APEMAP_OFFLINE: "0"
        run: uv run apemap inputs restore

      - name: Preinstall DuckDB spatial extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial')"

      - name: Verify cached input files manifest
        run: uv run apemap inputs verify

      - name: Run Pytest suite
        run: uv run pytest

  pipeline:
    name: Offline Pipeline Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --extra review-ui --frozen

      - name: Restore pinned raw inputs
        env:
          APEMAP_OFFLINE: "0"
        run: uv run apemap inputs restore

      - name: Preinstall DuckDB spatial extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial')"

      - name: Run full pipeline in strict offline mode
        run: |
          uv run apemap run-all \
            --offline \
            --inputs-manifest data/inputs-manifest.json \
            --db-path /tmp/ci_aped.duckdb \
            --output-dir /tmp/ci_pipeline_out \
            --strict

  release-contract:
    name: Release Contract Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --extra review-ui --frozen

      - name: Restore pinned raw inputs
        env:
          APEMAP_OFFLINE: "0"
        run: uv run apemap inputs restore

      - name: Preinstall DuckDB spatial extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial')"

      - name: Execute pipeline and build release
        run: |
          uv run apemap run-all \
            --offline \
            --inputs-manifest data/inputs-manifest.json \
            --db-path /tmp/ci_release.duckdb \
            --output-dir /tmp/ci_processed \
            --strict
          uv run apemap release build \
            --db-path /tmp/ci_release.duckdb \
            --output-dir /tmp/ci_release_bundle \
            --version 0.0.0-ci \
            --strict

      - name: Verify release bundle integrity and privacy
        run: |
          uv run apemap release verify /tmp/ci_release_bundle --strict-assertions
