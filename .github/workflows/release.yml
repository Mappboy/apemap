name: Release

on:
  push:
    tags:
      - 'data-v*'
      - 'data-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version for dataset release (e.g. 1.0.0)'
        required: true
        type: string
      recipe:
        description: 'Reviewed recipe path committed on the release revision'
        required: true
        type: string
        default: 'data/release-recipes/historical.json'
      inputs_archive_url:
        description: 'HTTPS bundle of the exact historical raw inputs (verified against recipe pins)'
        required: true
        type: string

permissions:
  contents: write

env:
  APEMAP_OFFLINE: "1"
  RECIPE_PATH: ${{ github.event.inputs.recipe || vars.APEMAP_RELEASE_RECIPE || 'data/release-recipes/historical.json' }}
  INPUT_ARCHIVE_URL: ${{ github.event.inputs.inputs_archive_url || vars.APEMAP_HISTORICAL_INPUTS_URL }}

jobs:
  release:
    name: Build, Verify and Publish Immutable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release trigger is on main branch
        id: branch-check
        run: |
          # Release publication is strictly restricted to commits on the main/master branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
              echo "Error: Manual release dispatch must be executed against main branch. Current branch: ${{ github.ref_name }}"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            git fetch origin main:refs/remotes/origin/main 2>/dev/null || git fetch origin master:refs/remotes/origin/master 2>/dev/null
            MAIN_REF=$(git rev-parse --verify origin/main 2>/dev/null || git rev-parse --verify origin/master 2>/dev/null)
            if [ -n "$MAIN_REF" ]; then
              if ! git merge-base --is-ancestor ${{ github.sha }} "$MAIN_REF"; then
                echo "Error: Tag was pushed on a commit (${{ github.sha }}) not contained in main branch."
                exit 1
              fi
            else
              echo "Error: Neither origin/main nor origin/master remote branch found."
              exit 1
            fi
          fi

      - name: Determine release version and tag name
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VER="$REQUESTED_VERSION"
          else
            RAW_TAG="$REF_NAME"
            VER=$(echo "$RAW_TAG" | sed -E 's/^data-v?//')
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV
          echo "TAG_NAME=data-v$VER" >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --extra review-ui --frozen

      - name: Restore pinned raw inputs
        env:
          APEMAP_OFFLINE: "0"
        run: |
          if [ -z "$INPUT_ARCHIVE_URL" ]; then
            echo "Set inputs_archive_url or APEMAP_HISTORICAL_INPUTS_URL to the approved historical input bundle."
            exit 1
          fi
          uv run apemap release recipe inputs-restore --recipe "$RECIPE_PATH" --archive-url "$INPUT_ARCHIVE_URL"

      - name: Preinstall DuckDB spatial extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial')"

      - name: Run pipeline and build release bundle
        run: |
          mkdir -p /tmp/build_db
          uv run apemap release recipe build \
            --recipe "$RECIPE_PATH" \
            --db-path /tmp/build_db/aped.duckdb \
            --output-dir /tmp/release_bundle \
            --version "$RELEASE_VERSION"

      - name: Check deterministic recipe replay
        run: |
          uv run apemap release recipe build \
            --recipe "$RECIPE_PATH" \
            --db-path /tmp/build_db/replay.duckdb \
            --output-dir /tmp/release_replay \
            --version "$RELEASE_VERSION"
          uv run apemap release recipe compare /tmp/release_bundle /tmp/release_replay

      - name: Verify release bundle integrity and privacy
        run: |
          uv run apemap release verify /tmp/release_bundle --strict-assertions

      - name: Package release artifacts
        run: uv run python -m apemap.release.package /tmp/release_bundle --output-dir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$TAG_NAME"
          # Check if tag already exists in remote
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists"
          else
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

          gh release create "$TAG" dist/* \
            --title "APEMAP Dataset Release v${RELEASE_VERSION}" \
            --notes "Immutable, cryptographically verified APEMAP dataset release v${RELEASE_VERSION}. Contains web layers, analytical metrics, canonical data tables, manifest.json, and SHA256 checksums." \
            --draft=false
