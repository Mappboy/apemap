[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apemap"
version = "0.2.0"
description = "Australian Parliamentarians Education Map data and analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "sparqlwrapper>=2.0.0",
    "typer>=0.27.2",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
apemap = "apemap.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.80",
]
analysis = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.10.9",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.80",
]

[tool.hatch.build.targets.wheel]
packages = ["apemap"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "archive",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
