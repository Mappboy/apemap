[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apemap"
version = "0.2.0"
description = "Australian Parliamentarians Education Map data and analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5,<2",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "typer>=0.27.2",
]

[project.scripts]
apemap = "apemap.cli:app"

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "prek>=0.2.0",
    "pyarrow>=14.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.80",
]
analysis = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "marimo>=0.18.4",
    "matplotlib>=3.10.9",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "plotly>=7.1.0",
    "polars>=1.37.1",
]

[tool.hatch.build.targets.wheel]
packages = ["apemap"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.deptry]
known_first_party = ["apemap"]

[tool.deptry.per_rule_ignores]
DEP003 = ["urllib3", "apemap"]
