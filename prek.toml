# Configuration file for `prek`, a fast git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "^(archive/|data/|\\.venv/)"

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types = ["python"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format --check", language = "system", types = ["python"] },
    { id = "ty-check", name = "ty check", entry = "uv run ty check apemap/", language = "system", types = ["python"], pass_filenames = false },
    { id = "deptry", name = "deptry", entry = "uv run deptry apemap", language = "system", types = ["python"], pass_filenames = false },
]
